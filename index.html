<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Trainer – Station 2</title><style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700;900&display=swap');
:root{--ink:#31445a;--blue:#9dd8eb;--green:#bfe4c5;--pink:#f7caca;--yellow:#ffe7a7;--paper:#fbfcfa;--card:#fff;--bad:#f5baba;--good:#bfe8c6}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fcff,#fffaf3);color:var(--ink);font-family:Nunito,Arial,sans-serif;min-height:100vh}.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}h1,h2,.hand{font-family:'Patrick Hand','Comic Sans MS',cursive}h1{font-size:42px;margin:5px 0;text-align:center}.sub{text-align:center;margin:0 0 24px;color:#718096}.levels{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.level{border:0;border-radius:22px;padding:25px;background:white;box-shadow:0 7px 25px #aab8c526;text-align:left;cursor:pointer;color:var(--ink);transition:.18s}.level:hover{transform:translateY(-3px)}.level b{display:block;font-size:24px;margin-bottom:6px}.l1{border-left:9px solid var(--blue)}.l2{border-left:9px solid var(--green)}.l3{border-left:9px solid var(--pink)}.l4{border-left:9px solid var(--yellow)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.pill,.btn{border:0;border-radius:14px;padding:10px 15px;font-weight:800}.pill{background:#edf4f7}.btn{cursor:pointer;background:var(--blue);color:#233947}.btn.secondary{background:#edf1f3}.game{display:none}.game.active{display:block}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mem{min-height:86px;border:0;border-radius:16px;background:white;box-shadow:0 3px 13px #94a3b829;cursor:pointer;font:700 17px Nunito;color:transparent;position:relative;padding:10px}.mem:after{content:'?';color:#6aaec3;font:34px 'Patrick Hand';position:absolute;inset:0;display:grid;place-items:center}.mem.open,.mem.done{color:var(--ink)}.mem.open:after,.mem.done:after{display:none}.mem.done{background:#dff3e2}.q{background:#fff;border-radius:20px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #94a3b820}.q p{font-size:19px;margin:0 0 13px}.opts{display:flex;gap:10px;flex-wrap:wrap}.opt{border:2px solid #dbe7eb;background:#fff;border-radius:13px;padding:10px 17px;cursor:pointer;font-weight:700}.opt.good{background:var(--good);border-color:#78bd85}.opt.bad{background:var(--bad);border-color:#df8585}.inputrow{display:flex;gap:8px}.inputrow input{flex:1;border:2px solid #dbe7eb;border-radius:13px;padding:12px;font:16px Nunito}.feedback{font-size:14px;font-weight:700;margin-top:8px}.result{background:white;border-radius:25px;padding:32px;text-align:center;box-shadow:0 8px 30px #94a3b82b}.result .big{font:64px 'Patrick Hand';color:#58a8be}.progress{height:10px;background:#e9eff1;border-radius:9px;overflow:hidden;margin:10px 0 20px}.bar{height:100%;background:#8dcddd;width:0}.sentencebox textarea{width:100%;min-height:80px;border:2px solid #dbe7eb;border-radius:14px;padding:12px;font:16px Nunito;resize:vertical}.solution{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#f1f6f8}.judge{display:none;gap:8px;margin-top:10px}.judge button{border:0;padding:9px 13px;border-radius:11px;cursor:pointer;font-weight:800}.yes{background:var(--good)}.no{background:var(--bad)}@media(max-width:650px){.levels{grid-template-columns:1fr}.memory{grid-template-columns:repeat(3,1fr)}h1{font-size:34px}.wrap{padding:18px 12px}.mem{min-height:76px;font-size:15px}}
</style></head><body><div class="wrap"><section id="home"><h1>Vocabulary Trainer ✏️</h1><p class="sub">Station 2 · Choose a level and practise!</p><div class="levels"><button class="level l1" onclick="start(1)"><b>Level 1 · Memory</b>Find 7 English–German pairs.</button><button class="level l2" onclick="start(2)"><b>Level 2 · Fill the gap</b>Choose the right word in 7 sentences.</button><button class="level l3" onclick="start(3)"><b>Level 3 · Translate words</b>Translate 12 words into German.</button><button class="level l4" onclick="start(4)"><b>Level 4 · Translate sentences</b>Translate 5 sentences into German.</button></div></section><section id="game" class="game"><div class="top"><button class="btn secondary" onclick="home()">← Levels</button><span class="pill" id="score">0 points</span></div><h2 id="title"></h2><div class="progress"><div class="bar" id="bar"></div></div><div id="content"></div></section></div><script>
const V=[
['Nigeria','Nigeria'],['job','Arbeitsstelle / Job / Arbeit'],['left','verließ / hat verlassen'],['terrible','schrecklich / schlimm / furchtbar'],['like','wie'],['to understand','verstehen'],['forgot','vergaß / hat vergessen'],['embarrassed','verlegen'],['when','wenn / als'],['to happen','passieren / geschehen'],['to be homesick','Heimweh haben'],['call','Anruf / Ruf'],['could','konnte'],['expensive','teuer'],['month','Monat'],['to make friends','Freundschaften schließen'],['classmate','Klassenkamerad/in / Mitschüler/in'],['to join','beitreten / Mitglied werden / sich anschließen'],['bored','gelangweilt'],['thanks','danke'],['player','Spieler/in'],['lonely','einsam'],['amazed','erstaunt / verblüfft'],['jealous','eifersüchtig / neidisch'],['worried','beunruhigt / besorgt'],['information','Information'],['time','Mal'],['mechanic','Mechaniker/in'],['Jamaica','Jamaika'],['India','Indien'],['programmer','Programmierer/in'],['Romania','Rumänien'],['letter','Brief / Buchstabe'],['captain','Kapitän/in'],['sailor','Matrose / Matrosin / Seefahrer/in'],['to invite','einladen'],['Yours,','Dein/Deine; Ihr/Ihre (Briefschluss)'],['almost','fast / beinahe'],['to be lucky','Glück haben'],['to hurry','sich beeilen'],['below','unter / unterhalb / unten'],['to get off','aussteigen / absteigen'],['next','nächste/r/s'],['stop','Halt / Haltestelle'],['America','Amerika'],['to agree','zustimmen'],['crew','Crew / Besatzung / Mannschaft'],['joke','Witz / Scherz'],['to sign','unterschreiben / unterzeichnen'],['to enjoy','genießen / mögen'],['visit','Besuch']];
const S=[
['Grandma’s dad found a ___ in London.','job','month'],['The maths exam was ___.','terrible','lucky'],["I don't ___ the question.",'understand','invite'],['I was ___ because I was late.','embarrassed','expensive'],['What ___ in this film?','happens','hurries'],["Katie wasn't ___ at the summer camp.",'homesick','jealous'],["Phone calls aren't ___ now.",'expensive','lonely'],['There are twelve ___ in a year.','months','letters'],["It isn't easy to ___ at a new school.",'make friends','get off'],['My friends in my class are my ___.','classmates','sailors'],['Dad ___ the sports club with his friends.','joined','forgot'],['I have no friends and I’m very ___.','lonely','amazed'],['I was so ___.','worried','lucky'],['A car ___ repairs cars.','mechanic','captain'],['My mum is a computer ___.','programmer','sailor'],["Let's ___ Nisha to the party!",'invite','agree'],['55 minutes is ___ an hour.','almost','below'],["We're late, please ___.",'hurry','enjoy'],['Stop! I want to ___ the bus.','get off','join'],['The ___ stop is the museum.','next','terrible'],['I ___, this music is really cool.','agree','sign'],['The ___ is the people who work on a ship.','crew','classmate'],['My dad likes ___. They aren’t always funny.','jokes','letters'],['I forgot to ___ the letter.','sign','hurry'],['I always ___ her films very much.','enjoy','happen']];
const TS=[['Grandma’s dad found a job in London.','Omas Vater fand eine Arbeit in London.'],['The maths exam was terrible.','Die Matheprüfung war schrecklich.'],["I don't understand the question.",'Ich verstehe die Frage nicht.'],['I was embarrassed because I was late.','Ich war verlegen, weil ich zu spät war.'],["Katie wasn't homesick at the summer camp.",'Katie hatte im Ferienlager kein Heimweh.'],["Phone calls aren't expensive now.",'Telefonanrufe sind jetzt nicht teuer.'],["It isn't easy to make friends at a new school.",'Es ist nicht leicht, an einer neuen Schule Freundschaften zu schließen.'],['My friends in my class are my classmates.','Meine Freunde in meiner Klasse sind meine Klassenkameraden.'],['I have no friends and I’m very lonely.','Ich habe keine Freunde und bin sehr einsam.'],['A car mechanic repairs cars.','Ein Automechaniker repariert Autos.'],["Let's invite Nisha to the party!",'Lass uns Nisha zur Party einladen!'],['55 minutes is almost an hour.','55 Minuten sind fast eine Stunde.'],["We're late, please hurry.",'Wir sind spät dran, bitte beeil dich.'],['Stop! I want to get off the bus.','Stopp! Ich möchte aus dem Bus aussteigen.'],['The next stop is the museum.','Die nächste Haltestelle ist das Museum.'],['The crew is the people who work on a ship.','Die Crew sind die Menschen, die auf einem Schiff arbeiten.'],['I forgot to sign the letter.','Ich habe vergessen, den Brief zu unterschreiben.'],['I always enjoy her films very much.','Ich mag ihre Filme immer sehr gern.']];
let right=0,wrong=0,total=0,done=0,lock=false; const $=x=>document.getElementById(x), shuffle=a=>[...a].sort(()=>Math.random()-.5), esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function start(l){right=wrong=done=0;$('home').style.display='none';$('game').classList.add('active');$('score').textContent='0 points';$('bar').style.width='0'; if(l===1)memory();if(l===2)gaps();if(l===3)words();if(l===4)sentences()}
function home(){$('game').classList.remove('active');$('home').style.display='block'} function progress(){done++;$('score').textContent=right+' points';$('bar').style.width=(done/total*100)+'%'}
function finish(){setTimeout(()=>{$('content').innerHTML=`<div class="result"><div class="big">${right} / ${total}</div><h2>Great work!</h2><p>✓ ${right} correct &nbsp; · &nbsp; ✗ ${wrong} incorrect</p><button class="btn" onclick="home()">Choose another level</button></div>`},450)}
function memory(){total=7;$('title').textContent='Level 1 · Memory';let pairs=shuffle(V).slice(0,7),cards=shuffle(pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}]));let first=null,matched=0;$('content').innerHTML='<div class="memory">'+cards.map((c,i)=>`<button class="mem" data-p="${c.i}" data-i="${i}">${esc(c.t)}</button>`).join('')+'</div>';document.querySelectorAll('.mem').forEach(c=>c.onclick=()=>{if(lock||c.classList.contains('open')||c.classList.contains('done'))return;c.classList.add('open');if(!first){first=c;return}if(first.dataset.p===c.dataset.p){first.classList.add('done');c.classList.add('done');right++;matched++;progress();first=null;if(matched===7)finish()}else{wrong++;lock=true;setTimeout(()=>{first.classList.remove('open');c.classList.remove('open');first=null;lock=false},700)}})}
function gaps(){total=7;$('title').textContent='Level 2 · Fill the gap';let qs=shuffle(S).slice(0,7);$('content').innerHTML=qs.map((q,i)=>`<div class="q" id="q${i}"><p>${esc(q[0])}</p><div class="opts">${shuffle([q[1],q[2]]).map(o=>`<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`).join('');qs.forEach((q,i)=>document.querySelectorAll(`#q${i} .opt`).forEach(b=>b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;if(b.dataset.v===q[1]){b.classList.add('good');right++}else{b.classList.add('bad');wrong++;[...b.parentNode.children].find(x=>x.dataset.v===q[1]).classList.add('good')}progress();if(done===total)finish()}))}
function norm(s){return s.toLowerCase().trim().replace(/[.,!?;:]/g,'').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')}
function words(){total=12;$('title').textContent='Level 3 · English → German';let qs=shuffle(V).slice(0,12);$('content').innerHTML=qs.map((q,i)=>`<div class="q sentencebox" id="w${i}"><p><b>${esc(q[0])}</b></p><div class="inputrow"><input placeholder="German translation…"><button class="btn reveal">Check</button></div><div class="solution"><b>Original vocabulary:</b> ${esc(q[1])}</div><div class="judge"><button class="yes">✓ Correct</button><button class="no">✗ Incorrect</button></div></div>`).join('');qs.forEach((q,i)=>{let box=$(`#w${i}`),inp=box.querySelector('input');box.querySelector('.reveal').onclick=()=>{if(box.dataset.done)return;inp.disabled=true;box.querySelector('.solution').style.display='block';box.querySelector('.judge').style.display='flex';box.querySelector('.reveal').style.display='none'};box.querySelector('.yes').onclick=()=>judge(box,true);box.querySelector('.no').onclick=()=>judge(box,false)})}
function sentences(){total=5;$('title').textContent='Level 4 · Translate sentences';let qs=shuffle(TS).slice(0,5);$('content').innerHTML=qs.map((q,i)=>`<div class="q sentencebox" id="s${i}"><p><b>${esc(q[0])}</b></p><textarea placeholder="Translate into German…"></textarea><button class="btn reveal">Show solution</button><div class="solution">${esc(q[1])}</div><div class="judge"><button class="yes">✓ I got it right</button><button class="no">✗ Not quite</button></div></div>`).join('');qs.forEach((q,i)=>{let box=$(`#s${i}`);box.querySelector('.reveal').onclick=()=>{box.querySelector('.solution').style.display='block';box.querySelector('.judge').style.display='flex';box.querySelector('.reveal').style.display='none'};box.querySelector('.yes').onclick=()=>judge(box,true);box.querySelector('.no').onclick=()=>judge(box,false)})}function judge(box,ok){if(box.dataset.done)return;box.dataset.done=1;box.querySelectorAll('.judge button').forEach(b=>b.disabled=true);ok?right++:wrong++;progress();if(done===total)finish()}
</script></body></html>
